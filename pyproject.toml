[project]
name = "agent-harness-learning"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["langchain>=1.4", "langchain-ollama>=1.1"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]
